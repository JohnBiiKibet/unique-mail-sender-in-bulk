<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Mail System</title>
    <!-- Robust Standalone Libraries for Fully Offline Environments -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body { 
            font-family: system-ui, sans-serif; 
            max-width: 400px; 
            margin: 100px auto; 
            padding: 20px; 
            text-align: center;
        }
        input[type="file"] { 
            width: 100%; 
            padding: 15px; 
            box-sizing: border-box; 
            border-radius: 6px; 
            border: 2px dashed #ccc; 
            font-size: 15px; 
            background: white; 
            cursor: pointer; 
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button { 
            flex: 1;
            padding: 15px; 
            box-sizing: border-box; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            transition: background 0.2s, opacity 0.2s; 
            border: none;
            color: white; 
        }
        #submitBtn { 
            background: #28a745; 
        }
        #submitBtn:hover { 
            background: #218838; 
        }
        #cancelBtn {
            background: #dc3545;
            display: none;
        }
        #cancelBtn:hover {
            background: #bd2130;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" />
    
    <div class="btn-group">
        <button id="cancelBtn" onclick="cancelUploadedFile()">Cancel File</button>
        <button id="submitBtn" onclick="dispatchBulkEmails()">Execute Automation Blast</button>
    </div>

    <script>
        let structuredRows = [];

        // Offline Fallback Configuration Variables
        const keyPub = "YOUR_PUBLIC_KEY"; 
        const idServ = "YOUR_SERVICE_ID"; 
        const idTemp = "YOUR_TEMPLATE_ID"; 
        const subjectBase = "Official Certificate for {Course}";
        const messageBase = `Dear {Name},

Congratulations! Your custom digital certificate for finishing your {Course} program is successfully compiled and attached below as a PDF document.

Warm regards,
Management`;

        // Direct stream parser bypassing browser console locks
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const fileReader = new FileReader();
            fileReader.onload = function(event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbookData = XLSX.read(data, { type: 'array' });
                    
                    // Fixed index layout target
                    const firstSheetName = workbookData.SheetNames[0];
                    const referenceSheet = workbookData.Sheets[firstSheetName];
                    
                    structuredRows = XLSX.utils.sheet_to_json(referenceSheet);
                    
                    if (structuredRows.length > 0) {
                        document.getElementById('cancelBtn').style.display = "block";
                    } else {
                        alert("The file content layout is unreadable or empty.");
                        cancelUploadedFile();
                    }
                } catch (error) {
                    alert("Data format processing failed. Verify file structure.");
                    cancelUploadedFile();
                }
            };
            fileReader.readAsArrayBuffer(file);
        });

        function cancelUploadedFile() {
            document.getElementById('excelFile').value = "";
            structuredRows = [];
            document.getElementById('cancelBtn').style.display = "none";
        }

        async function dispatchBulkEmails() {
            if (structuredRows.length === 0) {
                alert("Please attach your file first before executing.");
                return;
            }

            const actionBtn = document.getElementById('submitBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            
            actionBtn.disabled = true;
            cancelBtn.disabled = true;
            actionBtn.innerText = "Processing...";

            for (let index = 0; index < structuredRows.length; index++) {
                const targetRow = structuredRows[index];
                
                let cleanMail = targetRow['Email'] || targetRow['email'] || targetRow['EMAIL'] || "";
                let recipientName = targetRow['Name'] || targetRow['name'] || "Valued Recipient";
                let educationalCourse = targetRow['Course'] || targetRow['course'] || "Program Training";

                if (!cleanMail) continue;

                try {
                    const { jsPDF } = window.jspdf;
                    let clearDoc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                    
                    clearDoc.setLineWidth(2);
                    clearDoc.rect(10, 10, 277, 190); 
                    clearDoc.setFont("helvetica", "bold");
                    clearDoc.setFontSize(32);
                    clearDoc.text("CERTIFICATE OF COMPLETION", 148, 50, { align: "center" });
                    
                    clearDoc.text(recipientName, 148, 105, { align: "center" });
                    clearDoc.text(educationalCourse, 148, 150, { align: "center" });
                    
                    const rawBase64Uri = clearDoc.output('datauristring');
                } catch (error) {
                    console.error("Local array dump failed:", error);
                }
            }
            alert("Automation blast sequence finalized.");
            actionBtn.disabled = false;
            cancelBtn.disabled = false;
            actionBtn.innerText = "Execute Automation Blast";
            cancelUploadedFile();
        }
    </script>
</body>
</html>
