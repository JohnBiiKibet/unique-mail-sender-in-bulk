<body>

<div class="app-container">
    <h2>Client Certificate Excel Processing Module (Standalone Offline)</h2>

    <!-- 1. Excel File Upload Section -->
    <fieldset>
        <legend> 1. Load Client Directory Spreadsheet (.xlsx) </legend>
        <div class="file-input-container">
            <label for="excelFile" class="custom-file-upload">Browse & Upload Excel Sheet</label>
            <input type="file" id="excelFile" accept=".xlsx, .csv" style="display: none;">
            <span id="fileStatus" class="file-status">No Excel file selected</span>
        </div>
    </fieldset>

    <!-- 2. Email Subject Config -->
    <fieldset>
        <legend> 2. Email Header Subject Config </legend>
        <input type="text" id="emailSubject" value="Your Verified Digital Performance Certificate Ready">
    </fieldset>

    <!-- 3. Dynamic Message Template Layout Engine -->
    <fieldset>
        <legend> 3. Dynamic Individual Template Editor </legend>
        <div style="font-size: 12px; color:#555; margin-bottom:5px;">Inject data fields dynamically: {name}, {email}, and {certificate}</div>
        <textarea id="msgTemplate">Hello {name},&#10;&#10;Your verified certificate ({certificate}) has been processed successfully. It has been routed to your target address: {email}.&#10;&#10;Best Regards.</textarea>
    </fieldset>

    <!-- Execution Trigger Button -->
    <button class="btn-send" id="btnSend">🚀 Run Client-Specific Email Generation Loop</button>

    <!-- 4. Real-time Status Console Logging Frame -->
    <fieldset style="margin-top: 15px;">
        <legend> System Status Log Terminal </legend>
        <div class="log-box" id="logBox"></div>
    </fieldset>
</div>

<script>
    let extractedClients = [];
    const fileInput = document.getElementById('excelFile');
    const fileStatus = document.getElementById('fileStatus');
    const logBox = document.getElementById('logBox');
    const btnSend = document.getElementById('btnSend');
    const msgTemplate = document.getElementById('msgTemplate');
    const emailSubject = document.getElementById('emailSubject');

    function log(message) {
        logBox.textContent += message + "\n";
        logBox.scrollTop = logBox.scrollHeight;
    }

    fileInput.addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
            const file = e.target.files[0];
            fileStatus.textContent = file.name;
            fileStatus.className = "file-status loaded";
            extractedClients = [];
            log(`[READY] Selected spreadsheet file: ${file.name}`);
        }
    });

    btnSend.addEventListener('click', function() {
        if (fileInput.files.length === 0) {
            alert("Upload a valid client Excel sheet first!");
            return;
        }
