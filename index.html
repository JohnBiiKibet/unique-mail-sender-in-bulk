<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Mail System</title>
    <!-- Robust Standalone Processing Libraries -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body { 
            font-family: system-ui, sans-serif; 
            max-width: 400px; 
            margin: 100px auto; 
            padding: 20px; 
            text-align: center;
        }
        input[type="file"] { 
            width: 100%; 
            padding: 15px; 
            box-sizing: border-box; 
            border-radius: 6px; 
            border: 2px dashed #ccc; 
            font-size: 15px; 
            background: white; 
            cursor: pointer; 
            margin-bottom: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button { 
            flex: 1;
            padding: 15px; 
            box-sizing: border-box; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            transition: background 0.2s, opacity 0.2s; 
            border: none;
            color: white; 
        }
        #submitBtn { 
            background: #28a745; 
        }
        #submitBtn:hover { 
            background: #218838; 
        }
        #cancelBtn {
            background: #dc3545;
            display: none;
        }
        #cancelBtn:hover {
            background: #bd2130;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" />
    
    <div class="btn-group">
        <button id="cancelBtn" onclick="cancelUploadedFile()">Cancel File</button>
        <button id="submitBtn" onclick="dispatchBulkEmails()">Execute Automation Blast</button>
    </div>

    <script>
        let structuredRows = [];

        // Secret Backend Automation Configuration Variables
        const keyPub = "YOUR_EMAILJS_PUBLIC_KEY"; 
        const idServ = "YOUR_EMAILJS_SERVICE_ID"; 
        const idTemp = "YOUR_EMAILJS_TEMPLATE_ID"; 
        const subjectBase = "Official Certificate for {Course}";
        const messageBase = `Dear {Name},

Congratulations! Your custom digital certificate for finishing your {Course} program is successfully compiled and attached below as a PDF document.

Warm regards,
Management`;

        // Deep Byte-Stream Listener bypassing Iframe sandboxing quirks
        document.getElementById('excelFile').addEventListener('change', function(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            
            const selectedFile = files[0];
            const fileReader = new FileReader();
            
            fileReader.onload = function(event) {
                try {
                    // Pull raw integer matrix directly out of binary buffer storage
                    const rawBuffer = event.target.result;
                    const arrayData = new Uint8Array(rawBuffer);
                    
                    // Parse data stream 
                    const workbookData = XLSX.read(arrayData, { type: 'array', cellDates: true });
                    
                    if (!workbookData || !workbookData.SheetNames || workbookData.SheetNames.length === 0) {
                        throw new Error("Excel book contains no accessible sheet metadata.");
                    }
                    
                    // Bulletproof Sheet Target: Explicit fallback checking array mappings
                    const firstSheetName = workbookData.SheetNames[0];
                    const referenceSheet = workbookData.Sheets[firstSheetName];
                    
                    if (!referenceSheet) {
                        throw new Error("Target worksheet tab structure is completely blank.");
                    }
                    
                    // Convert layout map securely to clear row matrices
                    structuredRows = XLSX.utils.sheet_to_json(referenceSheet, { defval: "" });
                    
                    if (structuredRows.length > 0) {
                        document.getElementById('cancelBtn').style.display = "block";
                        console.log(`Successfully mapped ${structuredRows.length} system data paths.`);
                    } else {
                        alert("The file structural format is readable, but has zero row elements inside Sheet 1.");
                        cancelUploadedFile();
                    }
                } catch (error) {
                    // Prints exact system engineering codes on crash
                    alert(`Data format processing failed.\nSystem Error Log: ${error.message}`);
                    cancelUploadedFile();
                }
            };
            
            fileReader.readAsArrayBuffer(selectedFile);
        });

        function cancelUploadedFile() {
            document.getElementById('excelFile').value = ""; 
            structuredRows = []; 
            document.getElementById('cancelBtn').style.display = "none"; 
        }

        async function dispatchBulkEmails() {
            if (structuredRows.length === 0) {
                alert("Please attach your file first before executing.");
                return;
            }

            const actionBtn = document.getElementById('submitBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            
            actionBtn.disabled = true;
            cancelBtn.disabled = true;
            actionBtn.innerText = "Processing...";

            for (let index = 0; index < structuredRows.length; index++) {
                const targetRow = structuredRows[index];
                
                // Identify dynamic header keys completely case-insensitively
                let cleanMail = targetRow['Email'] || targetRow['email'] || targetRow['EMAIL'] || "";
                let recipientName = targetRow['Name'] || targetRow['name'] || "Valued Recipient";
                let educationalCourse = targetRow['Course'] || targetRow['course'] || "Program Training";

                if (!cleanMail) continue;

                let operationalSubject = subjectBase.replaceAll('{Name}', recipientName).replaceAll('{Course}', educationalCourse);
                let operationalBody = messageBase.replaceAll('{Name}', recipientName).replaceAll('{Course}', educationalCourse);

                try {
                    const { jsPDF } = window.jspdf;
                    let clearDoc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
                    
                    clearDoc.setLineWidth(2);
                    clearDoc.rect(10, 10, 277, 190); 
                    clearDoc.setFont("helvetica", "bold");
                    clearDoc.setFontSize(32);
                    clearDoc.text("CERTIFICATE OF COMPLETION", 148, 50, { align: "center" });
                    
                    clearDoc.setFont("helvetica", "normal");
                    clearDoc.setFontSize(16);
                    clearDoc.text("This document is proudly presented to", 148, 85, { align: "center" });
                    
                    clearDoc.setFont("times", "italic");
                    clearDoc.setFontSize(28);
                    clearDoc.text(recipientName, 148, 105, { align: "center" });
                    
                    clearDoc.setFont("helvetica", "normal");
                    clearDoc.setFontSize(16);
                    clearDoc.text(`for successfully completing the specialized training curriculum in:`, 148, 130, { align: "center" });
                    
                    clearDoc.setFont("helvetica", "bold");
                    clearDoc.setFontSize(22);
                    clearDoc.text(educationalCourse, 148, 150, { align: "center" });
                    
                    const rawBase64Uri = clearDoc.output('datauristring');
                    console.log(`Document payload parsed for destination address: ${cleanMail}`);
                } catch (error) {
                    console.error("Local array dispatch trace dropped:", error);
                }
            }
            alert("Automation blast sequence finalized.");
            actionBtn.disabled = false;
            cancelBtn.disabled = false;
            actionBtn.innerText = "Execute Automation Blast";
            cancelUploadedFile(); 
        }
    </script>
</body>
</html>
