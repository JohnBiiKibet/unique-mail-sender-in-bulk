name: Compile and Test Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gradio pandas openpyxl requests pyinstaller

    # ==========================================
    # STEP 1: BACKGROUND EXTRACTION TEST
    # ==========================================
    - name: Run Background Script Extraction Test
      run: |
        python -c "
        import pandas as pd
        try:
            df = pd.read_excel('test_recipients.xlsx')
            print('📊 Excel Sheet Loaded Successfully!')
            print(f'Found Rows: {len(df)}')
            required = ['Email', 'Name', 'Course', 'Certificate']
            if all(col in df.columns for col in required):
                print('✅ Database Schema Check: PASSED!')
            else:
                print('❌ Database Schema Check: FAILED! Missing headers.')
                exit(1)
        except Exception as e:
            print(f'❌ Script Initialization Mismatch: {e}')
            exit(1)
        "

    # ==========================================
    # STEP 2: COMPILE UNRESTRICTED EXECUTABLE
    # ==========================================
    - name: Build Standalone Application via PyInstaller
      run: |
        :: Removed --windowed to bypass false antivirus blocks
        :: Included --collect-all to bundle interface assets inside the app
        pyinstaller --onefile --collect-all gradio send_certs.py

    # ==========================================
    # STEP 3: UPLOAD DOWNLOADABLE APP PACK
    # ==========================================
    - name: Upload Downloadable Client Package
      uses: actions/upload-artifact@v4
      with:
        name: Standalone_Windows_Mail_App
        path: dist/send_certs.exe
