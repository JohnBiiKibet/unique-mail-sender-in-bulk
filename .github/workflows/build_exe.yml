name: Package and Test Portable App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Bundler and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gradio pandas openpyxl requests mien

    # ==========================================
    # LIVE CODE TEST STEP
    # ==========================================
    - name: Run Background Script Extraction Test
      run: |
        python -c "
        import pandas as pd
        try:
            df = pd.read_excel('test_recipients.xlsx')
            print('📊 Excel Sheet Loaded Successfully!')
            print(f'Found Rows: {len(df)}')
            required = ['Email', 'Name', 'Course', 'Certificate']
            if all(col in df.columns for col in required):
                print('✅ Database Schema Check: PASSED!')
            else:
                print('❌ Database Schema Check: FAILED! Missing headers.')
                exit(1)
        except Exception as e:
            print(f'❌ Script Initialization Mismatch: {e}')
            exit(1)
        "

    - name: Compile Uncompressed Native Project Folder
      run: |
        mien send_certs.py --windowed

    - name: Create Portable Distribution Archive
      shell: powershell
      run: |
        Compress-Archive -Path dist/* -DestinationPath dist/Portable_Bulk_Mail_System.zip

    - name: Upload Downloadable Client Package
      uses: actions/upload-artifact@v4
      with:
        name: Portable_Windows_Mail_App
        path: dist/Portable_Bulk_Mail_System.zip
