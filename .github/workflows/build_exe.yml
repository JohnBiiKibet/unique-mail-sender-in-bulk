name: Compile Standalone Windows Executable

on:
  push:
    branches: [ main ]  # Triggers whenever you push changes to your main branch
  workflow_dispatch:     # Allows you to trigger the build manually with a button click

jobs:
  build:
    runs-on: windows-latest  # Fires up a virtual Windows machine in GitHub's cloud

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gradio pandas openpyxl requests pyinstaller

    - name: Build Standalone Application via PyInstaller
      run: |
        pyinstaller --onefile --windowed send_certs.py

    - name: Upload Downloadable Executable Asset
      uses: actions/upload-artifact@v4
      with:
        name: Bulk_Mail_System_Windows
        path: dist/send_certs.exe
