name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://JohnBiiKibet:$HF_TOKEN@huggingface.co/spaces/JohnBiiKibet/unique-mail-sender-in-bulk
          git push --force hf main
